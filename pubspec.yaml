name: myvitals_healthtracker_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  image_picker: ^1.2.1
  fl_chart: ^1.2.0
  screenshot: ^3.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  csv: ^8.0.0
  share_plus: ^12.0.2
  cross_file: ^0.3.5+2
  sqflite: ^2.4.2
  path: ^1.9.1
  sqflite_common_ffi_web: ^1.1.1
  local_auth: ^3.0.1
  url_launcher: ^6.3.2
  file_picker: ^8.1.7
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  uuid: ^4.5.3
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/demo/

  # Tipografías EMPAQUETADAS, no descargadas en tiempo de ejecución.
  # Es una decisión de rendimiento deliberada: `google_fonts` resolvía la
  # familia por red la primera vez, así que cambiar de tema podía provocar un
  # parpadeo de fuente (o fallar sin conexión). Con los .ttf en el binario, el
  # cambio de tema es un repintado puro, determinista y offline.
  #
  # Newsreader e Inter son fuentes VARIABLES (un archivo, eje `wght`): los
  # pesos se piden con `TextStyle.fontVariations`, centralizado en
  # `core/theme/tokens/app_typography.dart`. Licencias en assets/fonts/OFL-*.
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

    # Banderas. Ninguna de las cuatro familias de arriba trae emoji, así que el
    # selector de prefijo telefónico y el de idioma pintaban un cuadrito vacío
    # en vez de la bandera. Al empaquetar las fuentes se perdió el respaldo del
    # sistema, que es quien las resolvía antes.
    #
    # Es un RECORTE de Noto Color Emoji: sólo las 47 banderas que lista
    # `lib/core/constants/countries.dart`, 159 KB en vez de los 10,8 MB de la
    # fuente entera. `flag_glyph_coverage_test.dart` comprueba que el catálogo
    # de países y este recorte no se separen — si mañana se añade un país hay
    # que rehacer el recorte, y la prueba lo dice con nombre y apellidos.
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Flags.ttf
