name: Deploy web

# Compila la app a web y la publica en GitHub Pages en cada empujón a `main`,
# para que Health Tracker tenga una demo pública igual que el resto de proyectos
# de Iron-Coding. La demo arranca en modo demostración (dos años de datos), así
# se puede probar de punta a punta sin cuenta ni API.
#
# En pull request se ejecutan verificación y build pero NO se publica: así una
# propuesta se valida sin pisar lo que hay desplegado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages con OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. `cancel-in-progress: false` porque cancelar a mitad de
# una publicación puede dejar el sitio en un estado incompleto.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  verify:
    name: Verificación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        # BLOQUEANTE: el árbol se normalizó con `dart format` y a partir de aquí
        # el estilo es contrato. Si un cambio llega sin formatear, `--set-exit-if
        # -changed` devuelve !=0 y el build se detiene, con la lista de ficheros a
        # formatear. Para arreglarlo en local: `dart format lib test`.
        #
        # Se excluye `lib/l10n/generated/` (igual que en el analyze): lo produce
        # `gen-l10n` en el `pub get` de arriba, su estilo lo fija esa herramienta
        # y no debe gatearse contra `dart format`.
        run: >
          dart format --output=none --set-exit-if-changed
          $(find lib test -name '*.dart' -not -path 'lib/l10n/generated/*')

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        # Frena el despliegue ante cualquier regresión cubierta por las pruebas,
        # entre ellas los guardianes de invariantes: el contrato semántico de los
        # temas (familias de matiz y contraste AA), la cobertura de glifos y la
        # PARIDAD DE CLAVES l10n entre los cinco idiomas (`arb_key_parity_test`),
        # que impide que a un idioma se le quede una clave sin traducir.
        run: flutter test

  build:
    name: Build web
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar
        # `--base-href` con el nombre del repo: en Pages el sitio se sirve bajo
        # /<repo>/ y sin esto los assets se buscarían en la raíz y no cargarían.
        # `--no-web-resources-cdn` empaqueta CanvasKit en el propio sitio, así el
        # arranque no depende de un CDN externo.
        run: |
          flutter build web --release \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --no-web-resources-cdn

      - name: Evitar que Pages procese el build con Jekyll
        run: touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar
    needs: build
    # Sólo publica desde `main`, nunca desde un pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
